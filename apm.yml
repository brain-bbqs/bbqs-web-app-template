# Agent skills this repository installs from shared collections, each pinned to a commit.
# `apm install --frozen` restores them from apm.lock.yaml into .claude/skills/, where the copies are
# generated and git-ignored: improve a skill in its own repository, then move the pin here.
name: web-app-template
version: 1.0.0
description: Agent skills this app installs from shared collections.
targets:
  - claude
dependencies:
  apm:
    - git: con/skills
      ref: c241a4e9ec492d885c58864737280fef8637b269
      skills:
        - setup-chromatic
  mcp: []
includes: auto
scripts: {}
